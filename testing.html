<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>


<body>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-center w-full mb-6">
        <!-- Nút filter -->
    <div class="w-full lg:col-span-1 space-y-6">
          <button id="open-filter-btn"
            class="bg-[#00B307] text-white max-w-32.75 px-6 py-3.5 rounded-full text-[14px] font-semibold flex items-center gap-3 hover:opacity-90 cursor-pointer w-full sm:w-auto justify-center mb-4">
            ${buttonName}
            ${filter}
          </button>

          <div id="mobile-filter-drawer"
            class="absolute top-16 left-0 w-full bg-white border border-neutral-100 shadow-xl rounded-2xl p-6 z-40 lg:relative lg:top-auto lg:left-auto lg:shadow-none lg:border-none lg:p-0 lg:block mt-2 lg:mt-0">
            <div id="sidebar" class="w-full"></div>
          </div>
        </div>

       <div class="flex items-center justify-between gap-4 pb-4 w-full">
            <!-- Cụm sort by -->
            <div class="flex items-center gap-2">
              <span class="text-sm text-gray-500">Sort by:</span>
              <div class="relative min-w-41.5">
                <select 
                  id="sort-select"
                  class ="w-full px-3 py-2 border border-gray-200 rounded text-gray-700 bg-white cursor-pointer focus:outline-none focus:border-primary text-sm font-poppins"
                  >
                    ${optionsHtml}
                </select>
              </div>
              </div>
            </div>  
            <!-- Result found  -->
            <div class="text-sm text-neutral-500">
              <span class="font-semibold text-neutral-900">${totalResults}</span> Results Found
            </div>
          </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
