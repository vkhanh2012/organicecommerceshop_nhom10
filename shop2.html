<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="font-['Poppins'] bg-white">
    <div id="navigation-container"></div>
    <div id="breadcrumbs-container"></div>
    <main class="bg-white py-8 md:py-12 xl:py-16">
        <section class="container-custom">
            <h1 class="sr-only">Shop</h1>

            <!-- Banner -->
            <div class="relative overflow-hidden rounded-lg">
                <img src="/src/assets/images/Discount Bannar.webp" alt="Sale of the Month"
                    class="block h-auto w-full scale-x-[-1]" />

                <div class="absolute inset-y-0 left-0 flex w-1/2 flex-col justify-center px-6 md:px-10 xl:px-14">
                    <p class="text-xs font-medium uppercase tracking-wide text-white">
                        Best Deals
                    </p>

                    <h2 class="mt-2 text-2xl font-semibold text-white md:text-3xl xl:text-4xl">
                        Sale of the Month
                    </h2>

                    <div class="mt-4 hidden items-center gap-3 text-primary md:flex">
                        <span>00</span>
                        <span>:</span>
                        <span>02</span>
                        <span>:</span>
                        <span>18</span>
                        <span>:</span>
                        <span>46</span>
                    </div>

                    <a href="#product-grid-container"
                        class="mt-5 inline-flex w-fit items-center rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-primary-dark">
                        Shop Now
                    </a>
                </div>
            </div>

            <!-- Filter ngang và sort -->
            <div class="mt-8">
                <div id="horizontal-filter-container" class="w-full"></div>
            </div>

            <!-- Active filter -->
            <div id="active-filter-container"
                class="mt-5 flex min-h-10 flex-col gap-3 border-y border-neutral-100 py-3 md:flex-row md:items-center md:justify-between">
            </div>

            <!-- Product -->
            <div id="product-grid-container" class="mt-8 w-full"></div>
        </section>
    </main>
    <div id="newsletter-container"></div>
    <div id="footer-container"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
