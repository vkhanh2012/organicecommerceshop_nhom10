<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Organic Products | Ecobazar</title>
  <meta name="description" content="Browse, filter, and sort fresh organic fruit, vegetables, and groceries at Ecobazar.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shop Organic Products | Shopery">
  <meta property="og:description" content="Browse and filter Shopery's selection of fresh organic products.">
  <meta property="og:image" content="/src/assets/images/Discount Bannar.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
</head>

<body class="font-['Poppins'] bg-white">
  <div id="navigation-container"></div>

  <div id="breadcrumbs-container" class="min-h-24 sm:min-h-[120px]"></div>


  <!-- Products -->
  <section class="bg-white pt-8 pb-12 md:pt-10 md:pb-14 lg:pt-[32px] lg:pb-16">
    <h1 class="sr-only">Shop Organic Products</h1>
    <div class="container-custom mx-auto">
      <!-- Lưới filter và sản phẩm -->
      <div id="top-Bar" class="mb-5 flex w-full flex-col gap-4 md:flex-row md:items-center md:justify-between lg:mb-6"></div>
      <!-- Sidebar và danh sách sản phẩm -->
      <div class="relative grid w-full grid-cols-1 items-start gap-6 md:gap-8 lg:grid-cols-4 lg:gap-6">
        <!-- Cột trái -->
        <div class="w-full lg:col-span-1">
          <div id="mobile-filter-drawer"
            class="hidden absolute left-0 top-0 z-40 w-full rounded-2xl border border-neutral-100 bg-white p-6 shadow-xl lg:relative lg:block lg:border-none lg:p-0 lg:shadow-none">
            <div id="sidebar" class="w-full"></div>
          </div>
        </div>
        <!-- Cột phải -->
        <div class="w-full lg:col-span-3">
          <div id="product-grid-container" class="w-full"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="newsletter-container"></div>
  <div id="footer-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
